var activeToolContext = null;

function getActiveInput(){
  if(!activeToolContext) throw new Error("未指定工作区");

function getActiveOutput(){
  if(!activeToolContext) throw new Error("未指定工作区");

function showActiveError(message){
  if(activeToolContext){
    activeToolContext.fail(String(message));
    return;
  }
  window.console.error(message);
}

function escapeHtml(value){
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function writeActiveText(value){
  getActiveOutput().textContent = String(value);
}



function IsArray(obj) {

  return obj &&

          typeof obj === 'object' &&

          typeof obj.length === 'number' &&

          !(obj.propertyIsEnumerable('length'));

}

    return this.replace(new RegExp(s1,"gm"),s2); 
}

function Process1(){
  var json = getActiveInput().value;
  json=json.replaceAll("\n","");
  var html = "";
  try{
    if(json == "") json = "\"\"";
    html = ProcessParams(json);
    getActiveOutput().innerHTML = "<PRE class='CodeContainer'>"+html+"</PRE>";
  }catch(e){
    showActiveError("语法错误,不能格式化,错误信息:\n"+e.message);
  }
}

function ProcessParams(obj){
	var html = "";
	var params= new Array();
	params = obj.split("&");
	if(params.length <= 1) params = obj.split(",");

	for (i=0;i<params.length ;i++ ) {
		html = html + escapeHtml(params[i])+"<br/>";
	}
	return html;
}

function MD5Decode(){
	var input = getActiveInput().value;
	try{
		if(input == ""){
			showActiveError("请输入要解码的MD5哈希值");
			return;
		}
		// 清除空格和换行
		input = input.replace(/\s+/g, '');
		
		// 验证是否是有效的MD5格式（32位16进制）
		if(!/^[a-fA-F0-9]{32}$/.test(input)){
			showActiveError("输入的不是有效的MD5哈希值（需要32位16进制字符）");
			return;
		}
		
		var resultHTML = "<div style='padding:10px;'>";
		resultHTML += "<p style='color:#CC0000; font-weight:bold;'>注意：MD5是单向哈希算法，无法直接解码。</p>";
		resultHTML += "<p>MD5哈希值: <span style='color:#007777; font-weight:bold;'>" + input + "</span></p>";
		resultHTML += "<p>您可以尝试：</p>";
		resultHTML += "<ul>";
		resultHTML += "<li>使用在线MD5彩虹表查询服务（如 cmd5.com、md5decrypt.net）</li>";
		resultHTML += "<li>如果是简单密码，可能在常见密码库中找到对应明文</li>";
		resultHTML += "<li>如果是复杂字符串或加盐哈希，几乎不可能还原</li>";
		resultHTML += "</ul>";
		resultHTML += "</div>";
		
		getActiveOutput().innerHTML = resultHTML;
	}catch(e){
		showActiveError("MD5解码失败,错误信息:\n"+e.message);
	}
}

// ========== 时间戳转换 ==========
function TimestampToDate(){
	var input = getActiveInput().value.trim();
	try{
		if(input == ""){
			showActiveError("请输入Unix时间戳（秒或毫秒）");
			return;
		}
		var ts = parseFloat(input);
		if(isNaN(ts)){
			showActiveError("请输入有效的数字时间戳");
			return;
		}
		// 自动判断秒级还是毫秒级（13位为毫秒，10位为秒）
		if(ts < 1e12) ts = ts * 1000;
		var d = new Date(ts);
		var pad = function(n){ return n < 10 ? '0'+n : n; };
		var result = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())
			+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
		var html = "<div style='padding:10px;'>";
		html += "<p>时间戳: <b>"+input+"</b></p>";
		html += "<p>本地时间: <b style='color:#007777;'>"+result+"</b></p>";
		html += "<p>UTC时间: <b style='color:#AA00AA;'>"+d.toUTCString()+"</b></p>";
		html += "</div>";
		getActiveOutput().innerHTML = html;
	}catch(e){
		showActiveError("时间戳转换失败,错误信息:\n"+e.message);
	}
}

function DateToTimestamp(){
	var input = getActiveInput().value.trim();
	try{
		if(input == ""){
			// 输入为空则显示当前时间戳
			var now = new Date();
			var html = "<div style='padding:10px;'>";
			html += "<p>当前时间: <b>"+now.toLocaleString()+"</b></p>";
			html += "<p>秒级时间戳: <b style='color:#007777;'>"+Math.floor(now.getTime()/1000)+"</b></p>";
			html += "<p>毫秒级时间戳: <b style='color:#AA00AA;'>"+now.getTime()+"</b></p>";
			html += "</div>";
			getActiveOutput().innerHTML = html;
			return;
		}
		var d = new Date(input);
		if(isNaN(d.getTime())){
			showActiveError("请输入有效的日期时间（如：2024-01-01 12:00:00），或留空查看当前时间戳");
			return;
		}
		var html = "<div style='padding:10px;'>";
		html += "<p>日期时间: <b>"+escapeHtml(input)+"</b></p>";
		html += "<p>秒级时间戳: <b style='color:#007777;'>"+Math.floor(d.getTime()/1000)+"</b></p>";
		html += "<p>毫秒级时间戳: <b style='color:#AA00AA;'>"+d.getTime()+"</b></p>";
		html += "</div>";
		getActiveOutput().innerHTML = html;
	}catch(e){
		showActiveError("日期转时间戳失败,错误信息:\n"+e.message);
	}
}

// ========== HTML 编码/解码 ==========
function HtmlEncode(){
	var input = getActiveInput().value;
	try{
		if(input == ""){
			showActiveError("请输入要编码的内容");
			return;
		}
		var encoded = input

			.replace(/</g, '&lt;')

		writeActiveText(encoded);
	}catch(e){
		showActiveError("HTML编码失败,错误信息:\n"+e.message);
	}
}

function HtmlDecode(){
	var input = getActiveInput().value;
	try{
		if(input == ""){
			showActiveError("请输入要解码的HTML内容");
			return;
		}
		var decoded = input
			.replace(/&amp;/g, '&')
			.replace(/&lt;/g, '<')
			.replace(/&gt;/g, '>')
			.replace(/&quot;/g, '"')

		writeActiveText(decoded);
	}catch(e){
		showActiveError("HTML解码失败,错误信息:\n"+e.message);
	}
}

// ========== 字符统计 ==========
function CharCount(){
	var input = getActiveInput().value;
	try{
		var charCount = input.length;
		var noSpaceCount = input.replace(/\s/g, '').length;
		var lineCount = input === '' ? 0 : input.split('\n').length;
		var wordCount = input.trim() === '' ? 0 : input.trim().split(/\s+/).length;
		// 计算字节数（UTF-8）
		var byteCount = 0;
		for(var i = 0; i < input.length; i++){
			var code = input.charCodeAt(i);
			if(code <= 0x007F) byteCount += 1;
			else if(code <= 0x07FF) byteCount += 2;
			else byteCount += 3;
		}
		// 中文字符数
		var cnCount = (input.match(/[\u4e00-\u9fa5]/g) || []).length;
		var html = "<div style='padding:10px;'>";
		html += "<table style='border-collapse:collapse;'>";
		html += "<tr><td style='padding:4px 16px 4px 0;color:#CC0000;font-weight:bold;'>总字符数</td><td style='padding:4px;'><b>"+charCount+"</b></td></tr>";
		html += "<tr><td style='padding:4px 16px 4px 0;color:#CC0000;font-weight:bold;'>非空白字符数</td><td style='padding:4px;'><b>"+noSpaceCount+"</b></td></tr>";
		html += "<tr><td style='padding:4px 16px 4px 0;color:#CC0000;font-weight:bold;'>字节数(UTF-8)</td><td style='padding:4px;'><b>"+byteCount+"</b></td></tr>";
		html += "<tr><td style='padding:4px 16px 4px 0;color:#CC0000;font-weight:bold;'>中文字符数</td><td style='padding:4px;'><b>"+cnCount+"</b></td></tr>";
		html += "<tr><td style='padding:4px 16px 4px 0;color:#CC0000;font-weight:bold;'>单词数</td><td style='padding:4px;'><b>"+wordCount+"</b></td></tr>";
		html += "<tr><td style='padding:4px 16px 4px 0;color:#CC0000;font-weight:bold;'>行数</td><td style='padding:4px;'><b>"+lineCount+"</b></td></tr>";
		html += "</table></div>";
		getActiveOutput().innerHTML = html;
	}catch(e){
		showActiveError("字符统计失败,错误信息:\n"+e.message);
	}
}

	var json = getActiveInput().value;
	try{
		if(json.trim() == ""){
			showActiveError("请输入要压缩的JSON内容");
			return;
		}
		var obj = JSON.parse(json);
		var compressed = JSON.stringify(obj);
		writeActiveText(compressed);
	}catch(e){
		showActiveError("JSON压缩失败,请检查JSON格式是否正确\n错误信息:\n"+e.message);
	}
}

// ========== Schema 格式化 ==========
function SchemaFormat(){
	var input = getActiveInput().value.trim();
	try{
		if(input == ""){
			showActiveError("请输入Schema URL");
			return;
		}
		// 提取 scheme（://前面的部分）
		var schemeEnd = input.indexOf("://");
		if(schemeEnd === -1){
			showActiveError("无效的Schema URL，缺少://");
			return;
		}
		var scheme = input.substring(0, schemeEnd);
		var rest = input.substring(schemeEnd + 3);

		// 提取 host 和 path（?前面的部分）
		var queryStart = rest.indexOf("?");
		var hostPath = queryStart === -1 ? rest : rest.substring(0, queryStart);
		var queryString = queryStart === -1 ? "" : rest.substring(queryStart + 1);

		var slashIdx = hostPath.indexOf("/");
		var host = slashIdx === -1 ? hostPath : hostPath.substring(0, slashIdx);
		var path = slashIdx === -1 ? "" : hostPath.substring(slashIdx + 1);
		var uri = hostPath;

		// 解析参数
		var params = [];
		if(queryString !== ""){
			var pairs = queryString.split("&");
			for(var i = 0; i < pairs.length; i++){
				var eqIdx = pairs[i].indexOf("=");
				if(eqIdx === -1){
					params.push({ key: pairs[i], value: "" });
				} else {
					var k = pairs[i].substring(0, eqIdx);
					var v = pairs[i].substring(eqIdx + 1);
					try{ v = decodeURIComponent(v); }catch(e){}
					params.push({ key: k, value: v });
				}
			}
		}

		var html = "<div style='padding:10px; font-family:monospace;'>";
		html += "<p><span style='color:#CC0000;font-weight:bold;'>Schema:</span> <span style='color:#007777;'>" + escapeHtml(scheme) + "</span></p>";
		html += "<p><span style='color:#CC0000;font-weight:bold;'>Uri:</span> <span style='color:#007777;'>" + escapeHtml(uri) + "</span></p>";
		html += "<p><span style='color:#CC0000;font-weight:bold;'>Host:</span> <span style='color:#007777;'>" + escapeHtml(host) + "</span></p>";
		html += "<p><span style='color:#CC0000;font-weight:bold;'>Path:</span> <span style='color:#007777;'>" + escapeHtml(path) + "</span></p>";
		if(params.length > 0){
			html += "<p><span style='color:#CC0000;font-weight:bold;'>Params:</span></p>";
			html += "<table style='border-collapse:collapse; margin-left:16px;'>";
			for(var i = 0; i < params.length; i++){
				html += "<tr>";
				html += "<td style='padding:2px 8px 2px 0; color:#AA00AA; font-weight:bold;'>" + escapeHtml(params[i].key) + "</td>";
				html += "<td style='padding:2px 4px; color:#000;'>-&gt;</td>";
				html += "<td style='padding:2px 0 2px 8px; color:#007777;'>" + escapeHtml(params[i].value) + "</td>";
				html += "</tr>";
			}
			html += "</table>";
		} else {
			html += "<p><span style='color:#CC0000;font-weight:bold;'>Params:</span> <span style='color:#999;'>(无)</span></p>";
		}
		html += "</div>";
		getActiveOutput().innerHTML = html;
	}catch(e){
		showActiveError("Schema格式化失败,错误信息:\n"+e.message);
	}
}

// ========== 二维码生成 ==========
function GenerateQRCode(){
	var input = getActiveInput().value.trim();
	try{
		if(input == ""){
			showActiveError("请输入要生成二维码的内容");
			return;
		}
		if(typeof QRCode === "undefined"){
			showActiveError("二维码依赖加载失败，请检查网络后重试");
			return;
		}
		var canvas = getActiveOutput();
		canvas.innerHTML = "";

		var wrapper = document.createElement("div");
		wrapper.style.padding = "10px";

		var qrDiv = document.createElement("div");
		wrapper.appendChild(qrDiv);

		var hint = document.createElement("p");
		hint.style.color = "#666";
		hint.style.fontSize = "12px";
		hint.style.marginTop = "8px";
		hint.textContent = "内容：" + (input.length > 60 ? input.substring(0, 60) + "…" : input);
		wrapper.appendChild(hint);

		canvas.appendChild(wrapper);

		new QRCode(qrDiv, {
			text: input,
			width: 200,
			height: 200,
			colorDark: "#000000",
			colorLight: "#ffffff",
			correctLevel: QRCode.CorrectLevel.M
		});
	}catch(e){
		showActiveError("二维码生成失败,错误信息:\n"+e.message);
	}
}

function ProcessObject(obj, indent, addComma, isArray, isPropertyContent){

  var html = "";

  var comma = (addComma) ? "<span class='Comma'>,</span> " : "";

  var type = typeof obj;

 

  if(IsArray(obj)){

    if(obj.length == 0){

      html += GetRow(indent, "<span class='ArrayBrace'>[ ]</span>"+comma, isPropertyContent);

    }else{

      html += GetRow(indent, "<span class='ArrayBrace'>[</span>", isPropertyContent);

      for(var i = 0; i < obj.length; i++){

        html += ProcessObject(obj[i], indent + 1, i < (obj.length - 1), true, false);

      }

      html += GetRow(indent, "<span class='ArrayBrace'>]</span>"+comma);

    }

  }else if(type == 'object' && obj == null){

    html += FormatLiteral("null", "", comma, indent, isArray, "Null");

  }else if(type == 'object'){

    var numProps = 0;

    for(var prop in obj) numProps++;

    if(numProps == 0){

      html += GetRow(indent, "<span class='ObjectBrace'>{ }</span>"+comma, isPropertyContent);

    }else{

      html += GetRow(indent, "<span class='ObjectBrace'>{</span>", isPropertyContent);

      var j = 0;

      for(var prop in obj){

        html += GetRow(indent + 1, '<span class="PropertyName">"'+escapeHtml(prop)+'"</span>: '+ProcessObject(obj[prop], indent + 1, ++j < numProps, false, true));

      }

      html += GetRow(indent, "<span class='ObjectBrace'>}</span>"+comma);

    }

  }else if(type == 'number'){

    html += FormatLiteral(obj, "", comma, indent, isArray, "Number");

  }else if(type == 'boolean'){

    html += FormatLiteral(obj, "", comma, indent, isArray, "Boolean");

  }else if(type == 'function'){

    obj = FormatFunction(indent, obj);

    html += FormatLiteral(obj, "", comma, indent, isArray, "Function");

  }else if(type == 'undefined'){

    html += FormatLiteral("undefined", "", comma, indent, isArray, "Null");

  }else{

    html += FormatLiteral(obj, "\"", comma, indent, isArray, "String");

  }

  return html;

}

function FormatLiteral(literal, quote, comma, indent, isArray, style){

  if(typeof literal == 'string')

    literal = escapeHtml(literal);

  var str = "<span class='"+style+"'>"+quote+literal+quote+comma+"</span>";

  if(isArray) str = GetRow(indent, str);

  return str;

}

function FormatFunction(indent, obj){

  var tabs = "";

  for(var i = 0; i < indent; i++) tabs += window.TAB;

  var funcStrArray = obj.toString().split("\n");

  var str = "";

  for(var i = 0; i < funcStrArray.length; i++){

    str += ((i==0)?"":tabs) + funcStrArray[i] + "\n";

  }

  return str;

}

function GetRow(indent, data, isPropertyContent){

  var tabs = "";

  for(var i = 0; i < indent && !isPropertyContent; i++) tabs += window.TAB;

  if(data != null && data.length > 0 && data.charAt(data.length-1) != "\n")

    data = data+"\n";

  return tabs+data;                      

}
</script>

<body>
<main class="workbench-shell" id="WorkbenchShell">
	<header class="workbench-header">
		<div class="workbench-brand">MY TOOLS <span>/ WORKBENCH</span></div>
		<div class="workbench-header-actions">
			<span class="workbench-mode" id="WorkbenchMode">单工作区 · 本地运行</span>
			<button type="button" class="split-toggle" id="SplitToggle">开启分栏</button>
		</div>
	</header>
	<div class="workspace-stage" id="WorkspaceStage"></div>
</main>
<script>
var TOOL_CATEGORIES = [
	{ id: "json", label: "JSON" },
	{ id: "codec", label: "编解码" },
	{ id: "time", label: "时间" },
	{ id: "text", label: "文本" },
	{ id: "generate", label: "生成" }
];

var TOOL_REGISTRY = [
	{ id: "json-format", category: "json", label: "格式化", run: Process },
	{ id: "json-compress", category: "json", label: "压缩", run: JsonCompress },
	{ id: "params-format", category: "json", label: "参数格式化", run: Process1 },
	{ id: "schema-format", category: "json", label: "Schema 格式化", run: SchemaFormat },
	{ id: "base64-encode", category: "codec", label: "Base64 编码", run: Base64Encode },
	{ id: "base64-decode", category: "codec", label: "Base64 解码", run: Base64Decode },
	{ id: "url-encode", category: "codec", label: "URL 编码", run: UrlEncode },
	{ id: "url-decode", category: "codec", label: "URL 解码", run: UrlDecode },
	{ id: "html-encode", category: "codec", label: "HTML 编码", run: HtmlEncode },
	{ id: "html-decode", category: "codec", label: "HTML 解码", run: HtmlDecode },
	{ id: "md5-encode", category: "codec", label: "MD5 编码", run: MD5EncodeUpper },
	{ id: "md5-explain", category: "codec", label: "MD5 说明", run: MD5Decode },
	{ id: "timestamp-date", category: "time", label: "时间戳 → 日期", run: TimestampToDate },
	{ id: "date-timestamp", category: "time", label: "日期 → 时间戳", run: DateToTimestamp },
	{ id: "uppercase", category: "text", label: "转大写", run: ToUpperCase },
	{ id: "lowercase", category: "text", label: "转小写", run: ToLowerCase },
	{ id: "titlecase", category: "text", label: "首字母大写", run: ToTitleCase },
	{ id: "char-count", category: "text", label: "字符统计", run: CharCount },
	{ id: "qrcode", category: "generate", label: "生成二维码", run: GenerateQRCode }
];

function workspaceContext(root) {
	return {
		root: root,
		input: root.querySelector(".workspace-input"),
		output: root.querySelector(".workspace-output"),
		status: root.querySelector(".workspace-status"),
		notice: root.querySelector(".workspace-notice"),
		fail: function(message) {
			this.output.textContent = message;
			this.output.classList.add("output-error");
			this.status.textContent = "执行失败";
		}
	};
}

function copyText(text) {
	if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
	return new Promise(function(resolve, reject) {
		var textarea = document.createElement("textarea");
		textarea.value = text;
		textarea.style.position = "fixed";
		textarea.style.opacity = "0";
		document.body.appendChild(textarea);
		textarea.select();
		try {
			if(document.execCommand("copy")) resolve();
			else reject(new Error("浏览器拒绝复制"));
		} catch(error) {
			reject(error);
		} finally {
			document.body.removeChild(textarea);
		}
	});
}

function copyWorkspaceOutput(root) {
	var ctx = workspaceContext(root);
	var text = ctx.output.innerText || ctx.output.textContent || "";
	if(!text.trim()) {
		ctx.notice.textContent = "结果区为空";
		return;
	}
	copyText(text).then(function() {
		ctx.notice.textContent = "复制成功";
	}, function(error) {
		ctx.notice.textContent = "复制失败：" + error.message;
	});
}

function executeTool(root, tool) {
	var ctx = workspaceContext(root);
	ctx.output.classList.remove("output-error");
	ctx.notice.textContent = "";
	activeToolContext = ctx;
	try {
		tool.run(ctx);
		if(!ctx.output.classList.contains("output-error")) {
			root.setAttribute("data-last-tool-id", tool.id);
			root.querySelectorAll(".tool-command").forEach(function(button) {
				button.setAttribute("aria-pressed", button.getAttribute("data-tool-id") === tool.id ? "true" : "false");
			});
			ctx.status.textContent = "已执行：" + tool.label;
		}
	} catch(error) {
		ctx.fail(tool.label + "失败：" + error.message);
	} finally {
		activeToolContext = null;
	}
}

function updateCommandOverflow(row) {
	var atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 1;
	row.classList.toggle("has-more", row.scrollWidth > row.clientWidth + 1 && !atEnd);
}

function renderCommands(root, categoryId) {
	var row = root.querySelector(".tool-command-row");
	row.innerHTML = "";
	row.tabIndex = 0;
	var category = TOOL_CATEGORIES.filter(function(item) { return item.id === categoryId; })[0];
	row.setAttribute("aria-label", (category ? category.label : "当前类别") + "工具");
	TOOL_REGISTRY.forEach(function(tool) {
		if(tool.category !== categoryId) return;
		var button = document.createElement("button");
		button.type = "button";
		button.className = "tool-command";
		button.setAttribute("data-tool-id", tool.id);
		button.setAttribute("aria-pressed", root.getAttribute("data-last-tool-id") === tool.id ? "true" : "false");
		button.textContent = tool.label;
		button.addEventListener("click", function() { executeTool(root, tool); });
		row.appendChild(button);
	});
	window.setTimeout(function() { updateCommandOverflow(row); }, 0);
}

function renderCategoryTabs(root, activeCategory) {
	var tablist = root.querySelector(".tool-category-tabs");
	tablist.innerHTML = "";
	TOOL_CATEGORIES.forEach(function(category) {
		var button = document.createElement("button");
		button.type = "button";
		button.className = "tool-category-tab";
		button.setAttribute("role", "tab");
		button.setAttribute("data-category", category.id);
		button.setAttribute("aria-selected", category.id === activeCategory ? "true" : "false");
		button.textContent = category.label;
		button.addEventListener("click", function() {
			renderCategoryTabs(root, category.id);
			renderCommands(root, category.id);
		});
		tablist.appendChild(button);
	});
	renderCommands(root, activeCategory);
}

function createWorkspace(id, label) {
	var root = document.createElement("section");
	root.className = "tool-workspace";
	root.setAttribute("data-workspace-id", id);
	root.innerHTML = '<header class="workspace-header"><h2><span class="workspace-letter">' + label + '</span>工作区 ' + label + '</h2><div class="workspace-header-actions"><span class="workspace-status" aria-live="polite">等待输入</span><button type="button" class="workspace-close" aria-label="关闭工作区 ' + label + '" title="关闭工作区">×</button></div></header>' +
		'<label class="section-label">INPUT / 输入<textarea class="workspace-input" rows="5"></textarea></label>' +
		'<div class="section-label">TOOLS / 紧凑工具带</div><div class="compact-toolbar"><div class="tool-category-tabs" role="tablist" aria-label="工具类别"></div><div class="tool-command-row" role="group" aria-label="当前类别工具"></div></div>' +
		'<div class="output-heading"><span class="section-label">OUTPUT / 结果</span><button type="button" class="copy-output">复制结果</button></div>' +
		'<div class="workspace-output Canvas" tabindex="0"></div><div class="workspace-notice" aria-live="polite"></div>';
	renderCategoryTabs(root, "json");
	root.querySelector(".copy-output").addEventListener("click", function() {
		copyWorkspaceOutput(root);
	});
	root.querySelector(".workspace-close").addEventListener("click", function() {
		removeWorkspace(root);
	});
	root.querySelector(".tool-command-row").addEventListener("scroll", function(event) {
		updateCommandOverflow(event.currentTarget);
	});
	return root;
}

var LAYOUT_KEY = "mytools.workbench.layout.v1";
var workspaceSequence = 0;
var initialSplitRatio = 50;

function clampRatio(value) {
	return Math.max(30, Math.min(70, Math.round(value)));
}

function workspaceLabel(index) {
	var label = "";
	var value = index + 1;
	while(value > 0) {
		value -= 1;
		label = String.fromCharCode(65 + value % 26) + label;
		value = Math.floor(value / 26);
	}
	return label;
}

function saveSplitRatio(ratio) {
	initialSplitRatio = clampRatio(ratio);
	try {
		localStorage.setItem(LAYOUT_KEY, JSON.stringify({ ratio: initialSplitRatio }));
	} catch(error) {
		window.console.warn("无法保存分栏布局", error);
	}
}

function restoreSplitRatio() {
	try {
		var saved = JSON.parse(localStorage.getItem(LAYOUT_KEY));
		if(saved && typeof saved.ratio === "number") initialSplitRatio = clampRatio(saved.ratio);
	} catch(error) {
		try { localStorage.removeItem(LAYOUT_KEY); } catch(ignore) {}
	}
}

function setWorkspaceWidths(left, right, leftWidth, rightWidth) {
	left.style.flex = "0 0 " + Math.round(leftWidth) + "px";
	right.style.flex = "0 0 " + Math.round(rightWidth) + "px";
}

function updateRailValue(rail, left, right) {
	var total = left.getBoundingClientRect().width + right.getBoundingClientRect().width;
	var ratio = total ? Math.round(left.getBoundingClientRect().width / total * 100) : 50;
	rail.setAttribute("aria-valuenow", String(ratio));
	return ratio;
}

function resizeWorkspacePair(rail, left, right, delta) {
	var leftWidth = left.getBoundingClientRect().width;
	var rightWidth = right.getBoundingClientRect().width;
	var minWidth = 280;
	var appliedDelta = Math.max(minWidth - leftWidth, Math.min(rightWidth - minWidth, delta));
	setWorkspaceWidths(left, right, leftWidth + appliedDelta, rightWidth - appliedDelta);
	return updateRailValue(rail, left, right);
}

function createSplitRail(left, right) {
	var rail = document.createElement("div");
	rail.className = "split-rail";
	rail.setAttribute("role", "separator");
	rail.setAttribute("aria-label", "调整工作区宽度");
	rail.setAttribute("aria-orientation", "vertical");
	rail.setAttribute("aria-valuemin", "10");
	rail.setAttribute("aria-valuemax", "90");
	rail.setAttribute("aria-valuenow", "50");
	rail.tabIndex = 0;
	rail.innerHTML = '<span class="split-grip" aria-hidden="true">⋮</span>';
	var startX = 0;
	var startLeftWidth = 0;
	var startRightWidth = 0;
	rail.addEventListener("pointerdown", function(event) {
		if(window.matchMedia("(max-width: 860px)").matches) return;
		startX = event.clientX;
		startLeftWidth = left.getBoundingClientRect().width;
		startRightWidth = right.getBoundingClientRect().width;
		rail.setPointerCapture(event.pointerId);
	});
	rail.addEventListener("pointermove", function(event) {
		if(!rail.hasPointerCapture(event.pointerId)) return;
		var minWidth = 280;
		var delta = Math.max(minWidth - startLeftWidth, Math.min(startRightWidth - minWidth, event.clientX - startX));
		setWorkspaceWidths(left, right, startLeftWidth + delta, startRightWidth - delta);
		updateRailValue(rail, left, right);
	});
	rail.addEventListener("pointerup", function(event) {
		if(!rail.hasPointerCapture(event.pointerId)) return;
		rail.releasePointerCapture(event.pointerId);
		if(document.querySelectorAll(".tool-workspace").length === 2) saveSplitRatio(updateRailValue(rail, left, right));
	});
	rail.addEventListener("dblclick", function() {
		var total = left.getBoundingClientRect().width + right.getBoundingClientRect().width;
		setWorkspaceWidths(left, right, total / 2, total / 2);
		updateRailValue(rail, left, right);
		if(document.querySelectorAll(".tool-workspace").length === 2) saveSplitRatio(50);
	});
	rail.addEventListener("keydown", function(event) {
		if(event.key === "Home") {
			var total = left.getBoundingClientRect().width + right.getBoundingClientRect().width;
			setWorkspaceWidths(left, right, total / 2, total / 2);
		} else if(event.key === "ArrowLeft") resizeWorkspacePair(rail, left, right, -20);
		else if(event.key === "ArrowRight") resizeWorkspacePair(rail, left, right, 20);
		else return;
		event.preventDefault();
		var ratio = updateRailValue(rail, left, right);
		if(document.querySelectorAll(".tool-workspace").length === 2) saveSplitRatio(ratio);
	});
	return rail;
}

function refreshWorkspaceLayout() {
	var stage = document.getElementById("WorkspaceStage");
	stage.querySelectorAll(".split-rail").forEach(function(rail) { rail.remove(); });
	var workspaces = Array.prototype.slice.call(stage.querySelectorAll(".tool-workspace"));
	workspaces.forEach(function(workspace) {
		workspace.style.flex = "";
		workspace.querySelector(".workspace-close").hidden = workspaces.length === 1;
	});
	for(var index = 1; index < workspaces.length; index++) {
		stage.insertBefore(createSplitRail(workspaces[index - 1], workspaces[index]), workspaces[index]);
	}
	stage.classList.toggle("multi-open", workspaces.length > 1);
	document.getElementById("WorkbenchMode").textContent = workspaces.length === 1 ? "单工作区 · 本地运行" : workspaces.length + " 个工作区 · 本地运行";
	if(workspaces.length === 2 && !window.matchMedia("(max-width: 860px)").matches) {
		var availableWidth = stage.clientWidth - 12;
		setWorkspaceWidths(workspaces[0], workspaces[1], availableWidth * initialSplitRatio / 100, availableWidth * (100 - initialSplitRatio) / 100);
		updateRailValue(stage.querySelector(".split-rail"), workspaces[0], workspaces[1]);
	}
}

function addWorkspace() {
	var label = workspaceLabel(workspaceSequence);
	var workspace = createWorkspace("workspace-" + (workspaceSequence + 1), label);
	workspaceSequence += 1;
	var stage = document.getElementById("WorkspaceStage");
	stage.appendChild(workspace);
	refreshWorkspaceLayout();
	stage.scrollTo({ left: stage.scrollWidth, behavior: "smooth" });
}

function removeWorkspace(workspace) {
	var stage = document.getElementById("WorkspaceStage");
	if(stage.querySelectorAll(".tool-workspace").length === 1) return;
	workspace.remove();
	refreshWorkspaceLayout();
}

document.addEventListener("DOMContentLoaded", function() {
	restoreSplitRatio();
	addWorkspace();
	document.getElementById("SplitToggle").addEventListener("click", addWorkspace);
	window.addEventListener("resize", function() {
		document.querySelectorAll(".tool-command-row").forEach(updateCommandOverflow);
	});
});
</script>
</body>
</html>
